<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    Allow any user to own and call the ChromeOS bridge service names.
    These are normally owned by privileged ChromeOS daemons; here our
    bridge processes (running as the session user) impersonate them.
  -->

  <!-- shill (network) -->
  <policy context="default">
    <allow own="org.chromium.flimflam"/>
    <allow send_destination="org.chromium.flimflam"/>
    <allow receive_sender="org.chromium.flimflam"/>
  </policy>

  <!-- CRAS (audio) -->
  <policy context="default">
    <allow own="org.chromium.cras"/>
    <allow send_destination="org.chromium.cras"/>
    <allow receive_sender="org.chromium.cras"/>
  </policy>

  <!-- PowerManager (battery/suspend) -->
  <policy context="default">
    <allow own="org.chromium.PowerManager"/>
    <allow send_destination="org.chromium.PowerManager"/>
    <allow send_interface="org.chromium.PowerManager"/>
    <allow receive_sender="org.chromium.PowerManager"/>
  </policy>

  <!-- SessionManager (login/lock) -->
  <policy context="default">
    <allow own="org.chromium.SessionManager"/>
    <allow send_destination="org.chromium.SessionManager"/>
    <allow receive_sender="org.chromium.SessionManager"/>
  </policy>

  <!-- UserDataAuth (cryptohome / guest home) -->
  <policy context="default">
    <allow own="org.chromium.UserDataAuth"/>
    <allow send_destination="org.chromium.UserDataAuth"/>
    <allow receive_sender="org.chromium.UserDataAuth"/>
  </policy>

  <!--
    ScreenLockService — this one is not owned by a bridge: Chrome/Ash exports
    it (ash::ScreenLockServiceProvider). The session-bridge only *calls*
    ShowLockScreen when forwarding LockScreen(), exactly like the real
    session_manager does, and D-Bus denies method calls to destinations no
    policy mentions ("Sender is not authorized to send message").
  -->
  <policy context="default">
    <allow send_destination="org.chromium.ScreenLockService"/>
    <allow send_interface="org.chromium.ScreenLockServiceInterface"/>
    <allow receive_sender="org.chromium.ScreenLockService"/>
  </policy>

  <!-- Rmad (RMA daemon) -->
  <policy context="default">
    <allow own="org.chromium.Rmad"/>
    <allow send_destination="org.chromium.Rmad"/>
    <allow receive_sender="org.chromium.Rmad"/>
  </policy>

  <!-- stub-bridge: one-shot startup stubs for daemons this setup lacks -->
  <policy context="default">
    <allow own="org.chromium.TpmManager"/>
    <allow send_destination="org.chromium.TpmManager"/>
    <allow receive_sender="org.chromium.TpmManager"/>
    <allow own="org.chromium.ResourceManager"/>
    <allow send_destination="org.chromium.ResourceManager"/>
    <allow receive_sender="org.chromium.ResourceManager"/>
    <allow own="org.chromium.pciguard"/>
    <allow send_destination="org.chromium.pciguard"/>
    <allow receive_sender="org.chromium.pciguard"/>
    <allow own="org.chromium.VmPluginDispatcher"/>
    <allow send_destination="org.chromium.VmPluginDispatcher"/>
    <allow receive_sender="org.chromium.VmPluginDispatcher"/>
    <allow own="org.chromium.UpdateEngine"/>
    <allow send_destination="org.chromium.UpdateEngine"/>
    <allow receive_sender="org.chromium.UpdateEngine"/>
    <allow own="org.chromium.SmbProvider"/>
    <allow send_destination="org.chromium.SmbProvider"/>
    <allow receive_sender="org.chromium.SmbProvider"/>
    <allow own="org.chromium.Rgbkbd"/>
    <allow send_destination="org.chromium.Rgbkbd"/>
    <allow receive_sender="org.chromium.Rgbkbd"/>
    <allow own="org.chromium.MachineLearning"/>
    <allow send_destination="org.chromium.MachineLearning"/>
    <allow receive_sender="org.chromium.MachineLearning"/>
    <allow own="org.chromium.CrosDisks"/>
    <allow send_destination="org.chromium.CrosDisks"/>
    <allow receive_sender="org.chromium.CrosDisks"/>
    <allow own="org.chromium.BiometricsDaemon"/>
    <allow send_destination="org.chromium.BiometricsDaemon"/>
    <allow receive_sender="org.chromium.BiometricsDaemon"/>
  </policy>

  <!-- Crostini (Linux apps in launcher) -->
  <policy context="default">
    <allow own="org.chromium.VmConcierge"/>
    <allow send_destination="org.chromium.VmConcierge"/>
    <allow receive_sender="org.chromium.VmConcierge"/>
    <allow own="org.chromium.VmCicerone"/>
    <allow send_destination="org.chromium.VmCicerone"/>
    <allow receive_sender="org.chromium.VmCicerone"/>
    <allow own="org.chromium.DlcService"/>
    <allow send_destination="org.chromium.DlcService"/>
    <allow receive_sender="org.chromium.DlcService"/>
    <allow own="org.chromium.ImageLoader"/>
    <allow send_destination="org.chromium.ImageLoader"/>
    <allow receive_sender="org.chromium.ImageLoader"/>
    <allow own="org.chromium.debugd"/>
    <allow send_destination="org.chromium.debugd"/>
    <allow receive_sender="org.chromium.debugd"/>
  </policy>

  <!--
    Ash-owned ChromeOS browser services.

    With CHROMEOS_RELEASE_NAME set, Ash registers a set of in-process D-Bus
    services on the system bus. ChromeOS policy normally permits the browser
    process to own these names; plain Linux D-Bus policy refuses them and Ash
    treats that as fatal.
  -->
  <policy user="ash">
    <allow own_prefix="org.chromium"/>
    <!--
      No send_destination_prefix: dbus-broker parses that attribute but
      policy_import() has no dispatch case for it, so it logs "Invalid policy
      without defining attributes ... +<line>" and skips this ONE rule while
      still loading the rest of the file. It was redundant anyway — every send
      this session actually makes is already allowed by the per-bridge
      context="default" rules above and the explicit VmApplicationsService rule
      below (that is why everything keeps working while dbus-broker ignores it)
      — so it is left out to keep the config load clean. dbus-daemon would
      honour it, but gains nothing from it.
    -->
    <!--
      No receive_sender_prefix here: dbus < 1.15 (Debian/Ubuntu) does not know
      that attribute and silently drops this entire file from <includedir>,
      which breaks every bridge with "not allowed to own". Receiving replies
      and signals from the bridges is already granted per name by the
      context="default" policies above, and from VmApplicationsService by the
      rule below.
    -->
    <!-- allow bridge to call VmApplicationsService.UpdateApplicationList on Chrome.
         An explicit send_destination+send_interface is required: no
         context="default" rule covers this name (Chrome owns it, the bridges
         only call it) and D-Bus denies method_calls to unknown destinations by
         default. -->
    <allow send_destination="org.chromium.VmApplicationsService"
           send_interface="org.chromium.VmApplicationsService"/>
    <allow receive_sender="org.chromium.VmApplicationsService"/>
  </policy>
</busconfig>
