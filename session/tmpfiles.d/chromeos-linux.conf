# chromeos-linux runtime directories (systemd-tmpfiles).
#
# Installed by scripts/setup-system.sh as /etc/tmpfiles.d/chromeos-linux.conf,
# with @USER@ replaced by the account that runs the Ash session.
# Recreated on every boot; without this Chrome falls back to built-in clients
# for guest home, DLC and VM paths it expects to exist.
d /var/lib/ash-profile                                      0700 @USER@ users -
d /var/lib/ash-profile/test-user                            0700 @USER@ users -
d /run/mojo                                                 0755 @USER@ users -
d /home/chronos                                             0755 root    root  -
d /home/chronos/user                                        0755 @USER@ users -
d /var/lib/metrics/structured/chromium/storage/flushed      0755 @USER@ users -
# Chrome reads these once per minute (ExternalMetrics); without them the
# browser logs "Failed to create DirReaderPosix" twice per interval.
d /var/lib/metrics/uma-events                                0755 @USER@ users -
d /var/lib/metrics/uma-events.d                              0755 @USER@ users -
# Early per-pid UMA files (external_metrics.cc, kUmaEarlyMetricsDirectoryPath).
# This is the directory whose DirReaderPosix fails every 30s without it.
d /run/early-metrics                                         0755 @USER@ users -
d /var/log/chrome                                           0700 @USER@ users -
d /var/lib/dlc/termina-dlc/package/root                     0755 root    root  -
d /run/imageloader/cros-termina/99999.0.0                   0755 root    root  -
f /run/imageloader/cros-termina/99999.0.0/vm_kernel         0644 root    root  -
f /run/imageloader/cros-termina/99999.0.0/vm_rootfs.img     0644 root    root  -
d /run/daemon-store/crosvm/test-user                        0755 @USER@ users -
f /run/daemon-store/crosvm/test-user/termina.img            0644 @USER@ users -
# Crostini gate: Chrome stats /dev/kvm in CrostiniManager::CheckPaths() and
# refuses to launch ANY Linux app when it is absent ("Virtualization is not
# supported on this device"). The whole VM stack is faked over D-Bus, so
# nothing ever opens it — a placeholder file satisfies the existence check.
# Hosts WITH KVM: scripts/setup-system.sh deletes this line when installing
# (it would race udev and chmod the real device node) and, if this stub is
# already sitting at /dev/kvm, removes it and re-triggers udev.
f /dev/kvm                                                  0666 root    root  -
